name: Isolated browser smoke

# Browser downloads and UI timing are separate from the default source gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install temporary browser tooling without changing the lock
        run: |
          npm install --prefix "$RUNNER_TEMP/noetic-playwright" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/noetic-playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/noetic-playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: node scripts/qa/check-form-save-bar-focus-ui.mjs
      - run: node scripts/qa/check-library-compact-ui.mjs
      - name: Keep synthetic screenshots and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-smoke
          path: |
            test-results/form-save-bar-focus-ui/
            test-results/library-compact-ui/
          retention-days: 7
          if-no-files-found: ignore
